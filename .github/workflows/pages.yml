name: Pages

# Builds the showcase site: the landing page in site/, plus the example app and the dataset gallery
# packaged for the web with NSH, and deploys it to GitHub Pages. Pull requests get the build only, so a
# change that breaks packaging fails its pull request instead of the next deploy.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pull requests build in groups of their own, so they never cancel a deploy.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

env:
  NSH_VERSION: v0.6.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Add the web runtime
        run: |
          nsh --version
          nsh component add web

      - name: Package the demo and the gallery
        run: |
          nsh package --target web -o build/demo example
          nsh package --target web -o build/gallery example/Gallery.tsx

      - name: Assemble the site
        run: |
          mkdir -p _site/demo _site/gallery
          cp -r site/. _site/
          # nsh names its output folder after the app; take whatever single folder it made.
          cp -r build/demo/*/. _site/demo/
          cp -r build/gallery/*/. _site/gallery/
          # Pages compresses on its own; the precompressed copies only add weight.
          find _site -name '*.br' -delete -o -name '*.gz' -delete
          touch _site/.nojekyll
          du -sh _site
          ls _site _site/demo

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site
          # Since v4 dotfiles are left out by default; keep them (.nojekyll, and whatever nsh's web build writes).
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
